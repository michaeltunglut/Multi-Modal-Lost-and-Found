<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Reports · Campus Lost &amp; Found</title><style>
:root{--ink:#19362e;--green:#176b53;--soft:#e6f0e8;--paper:#f6f4ee;--line:#dbe2db;--muted:#63716d;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:20px 24px 50px}.top{border-bottom:1px solid var(--line);padding:4px 0 15px;font-weight:650}.top span{display:inline-grid;place-items:center;background:var(--green);color:white;width:32px;height:32px;border-radius:50% 50% 50% 5px;margin-right:9px}.hero{padding:45px 0 25px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:.13em;font-weight:bold}.hero h1{font:48px/1.02 var(--serif);font-weight:400;margin:12px 0}.hero p,.muted{color:var(--muted)}.hero p{margin:0;max-width:540px}.count{background:var(--soft);padding:14px 20px;border-radius:3px 18px;min-width:120px}.count strong{font:32px var(--serif);display:block}.count small{color:var(--muted)}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{padding:10px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted)}.tab.active{color:var(--green);border-color:var(--green);font-weight:bold}.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}.panel,.aside{background:#fffefa;border:1px solid var(--line);padding:22px;border-radius:5px}.panel h2,.aside h2,.toolbar h2{font:25px var(--serif);font-weight:400;margin:0}.sub{font-size:13px;color:var(--muted);margin:3px 0 19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650}.field input,.field textarea,.field select{padding:10px;border:1px solid var(--line);border-radius:4px;background:white}.field textarea{min-height:90px}.upload{padding:13px;text-align:center;border:1px dashed #9bb0a2;background:#f8faf6}.upload small{display:block;color:var(--muted);font-size:11px}.preview{display:none;max-height:160px;max-width:100%;margin:10px auto 0}.submit{background:var(--green);color:white;border:0;padding:12px 16px;border-radius:4px;margin-top:17px;font-weight:650}.submit:disabled{opacity:.5}.hint{display:block;color:var(--muted);font-size:11px;margin-top:7px}.status{display:none;padding:10px;margin-top:12px;border-radius:4px;background:#f5e8da;color:#704818;font-size:13px}.status.ok{background:var(--soft);color:var(--green)}.aside{margin-bottom:14px}.aside h2{font-size:21px}.step{display:flex;gap:10px;margin:15px 0}.num{background:var(--soft);color:var(--green);width:25px;height:25px;flex:none;border-radius:50%;text-align:center;font-weight:bold}.step b{display:block;font-size:13px}.step small{color:var(--muted)}.note{font-size:12px;color:var(--muted);border-left:2px solid #e9a45e;padding-left:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.filter{border:1px solid var(--line);border-radius:18px;padding:6px 11px;background:white;color:var(--muted);font-size:12px}.filter.active{background:var(--green);color:white}.list{display:grid;gap:9px}.card{background:#fffefa;border:1px solid var(--line);padding:11px;display:grid;grid-template-columns:70px 1fr auto;gap:13px;align-items:center}.card img,.match img{width:70px;height:68px;object-fit:cover;background:#eee}.card h3{font-size:14px;margin:0}.card p{margin:2px 0;color:var(--muted);font-size:12px}.badge{font-size:10px;padding:4px 7px;border-radius:12px;background:#e8eee7}.badge.LOST{background:#f4e5d4;color:#81501f}.badge.FOUND{color:var(--green)}.smallbtn{border:1px solid var(--line);background:white;color:var(--green);padding:6px 9px;font-size:11px;margin-top:5px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:#ffffff88}.matches{margin-top:18px}.match{display:grid;grid-template-columns:65px 1fr auto;gap:10px;align-items:center;background:white;border:1px solid var(--line);padding:9px;margin-top:7px}.match img{width:65px;height:65px}.match small{display:block;color:var(--muted);font-size:11px}.score{font:23px var(--serif);text-align:right;color:var(--green)}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:27px}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero h1{font-size:40px}.shell{padding:15px}.hero{padding-top:34px}}@media(max-width:520px){.hero{display:block}.count{display:inline-block;margin-top:15px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:flex-start;flex-direction:column}.card{grid-template-columns:56px 1fr}.card img{width:56px;height:58px}.card .badge{grid-column:2}}

.sighting-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.contactlink{display:inline-block;width:max-content}.deletebtn{color:#8f3429;border-color:#e3c7c2;margin-left:8px}.navlinks{margin-left:auto;display:flex;gap:18px}.navlinks a{color:#63716d;text-decoration:none;font-size:13px}.navlinks a.active{color:#176b53;font-weight:700}.toolbar{margin-top:24px}</style></head><body><div class="shell">
<header class="top" style="display:flex;align-items:center"><a href="/" style="color:inherit;text-decoration:none"><span>↗</span>Campus Lost &amp; Found</a><nav class="navlinks"><a href="/">Report an item</a><a class="active" href="/reports">Browse reports</a><a id="account-link" href="/account">Sign in</a></nav></header>
<section class="hero"><div><div class="eyebrow">REVA UNIVERSITY · COMMUNITY BOARD</div><h1>Browse reports</h1><p>Review lost and found reports and compare possible matches.</p></div><div class="count"><strong id="count">—</strong><small>active reports</small></div></section>
<div class="toolbar"><h2>Recent reports</h2><div><button class="filter active" data-filter="ALL">All</button> <button class="filter" data-filter="LOST">Lost</button> <button class="filter" data-filter="FOUND" id="found-filter" hidden>Found (admin)</button></div></div>
<div class="list" id="list"></div><section id="matches" class="matches" hidden></section><section id="sightings" class="matches" hidden></section><footer class="foot">Possible matches are suggestions. People confirm ownership.</footer></div>
<script>
const $=s=>document.querySelector(s);let filter='ALL', signedInUser=null;async function api(url,opt={}){const r=await fetch(url,opt);let d;try{d=await r.json()}catch{d={error:'Unexpected server response'}}if(!r.ok)throw Error(d.detail||d.detail||d.error||'Request failed');return d}function esc(x){const d=document.createElement('div');d.textContent=x;return d.innerHTML}
async function load(){const list=$('#list');list.innerHTML='<div class="empty">Loading…</div>';$('#matches').hidden=true;$('#sightings').hidden=true;try{const q=filter==='ALL'?'':`?type=${filter}`,rows=await api('/api/reports'+q);$('#count').textContent=rows.length;if(!rows.length){list.innerHTML='<div class="empty">No reports yet. Be the first to add one.</div>';return}list.replaceChildren();rows.forEach(r=>{const el=document.createElement('article');el.className='card';const im=document.createElement('img');im.src=r.image_url;const info=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('button'),tag=document.createElement('span');h.textContent=r.title;p.textContent=[r.category,r.colour,r.location,r.event_date].filter(Boolean).join(' · ');if(signedInUser?.role==='ADMIN'&&r.report_type==='FOUND'&&r.contact_method)p.textContent+=' · Contact: '+r.contact_method;b.className='smallbtn';if(r.can_view_matches&&r.report_type==='LOST'){b.textContent='View private found matches';b.onclick=()=>showMatches(r.id);info.append(h,p,b)}else{const note=document.createElement('small');note.textContent=signedInUser?'Found matches are visible only to this report’s poster and admins.':'Sign in with the account that posted this lost report to view its private found matches.';note.style.color='#63716d';info.append(h,p,note)}if(r.report_type==='LOST'&&r.can_report_sighting){const sight=document.createElement('button');sight.className='smallbtn';sight.textContent='Report a sighting';sight.onclick=()=>location.href=`/sightings/new?report=${r.id}`;info.append(sight)}if(r.report_type==='LOST'&&r.can_view_matches){const view=document.createElement('button');view.className='smallbtn';view.textContent='View sightings';view.onclick=()=>showSightings(r.id);info.append(view)}if(signedInUser?.role==='ADMIN'){const remove=document.createElement('button');remove.className='smallbtn deletebtn';remove.textContent='Remove report';remove.onclick=()=>deleteReport(r.id,r.title);info.append(remove)}tag.className='badge '+r.report_type;tag.textContent=r.report_type;el.append(im,info,tag);list.append(el)})}catch(e){list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.filter;load()});
async function showMatches(id){$('#sightings').hidden=true;const box=$('#matches');box.hidden=false;box.innerHTML='<div class="empty">Comparing image and description features…</div>';try{const ms=await api(`/api/reports/${id}/matches`);if(!ms.length){box.innerHTML='<div class="empty">No eligible opposite reports yet.</div>';return}box.innerHTML='<h2 style="font:23px Georgia;font-weight:400">Possible matches</h2>';ms.forEach(m=>{const e=document.createElement('article');e.className='match';const im=document.createElement('img');im.src=m.report.image_url;const info=document.createElement('div'),b=document.createElement('b'),a=document.createElement('small'),c=document.createElement('small');b.textContent=m.report.title;a.textContent=`${m.report.report_type} · ${m.report.category}${m.report.location?' · '+m.report.location:''}`;c.textContent=`Visual ${Math.round(m.image_score*100)}% · Description ${Math.round(m.text_score*100)}% · Category ${Math.round(m.category_score*100)}%`;info.append(b,a,c);if(m.report.report_type==='FOUND'){const contact=document.createElement('small');contact.textContent=m.report.contact_method?`Finder contact: ${m.report.contact_method}`:'Finder has not provided contact details for this older report.';info.append(contact)}if(m.match_id){const actions=document.createElement('div'),review=document.createElement('button'),reject=document.createElement('button');actions.style.marginTop='5px';review.className='smallbtn';review.textContent=m.match_status==='REVIEWED'?'Reviewed':'Mark reviewed';review.onclick=()=>updateMatch(m.match_id,'REVIEWED',review);reject.className='smallbtn';reject.style.marginLeft='5px';reject.textContent=m.match_status==='REJECTED'?'Rejected':'Not a match';reject.onclick=()=>updateMatch(m.match_id,'REJECTED',reject);actions.append(review,reject);info.append(actions)}const score=document.createElement('div');score.className='score';score.textContent=Math.round(m.final_score*100)+'%';const sm=document.createElement('small');sm.textContent='similarity';score.append(sm);e.append(im,info,score);box.append(e)});box.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function showSightings(id){$('#matches').hidden=true;const box=$('#sightings');box.hidden=false;box.innerHTML='<div class="empty">Loading sightings…</div>';try{const rows=await api(`/api/reports/${id}/sightings`);if(!rows.length){box.innerHTML='<div class="empty">No qualifying sightings yet.</div>';return}box.innerHTML='<h2 style="font:23px Georgia;font-weight:400">Sighting reports</h2>';rows.forEach(s=>{const e=document.createElement('article');e.className='match';const im=document.createElement('img');im.src=s.image_url;im.alt='Sighting photo';const info=document.createElement('div'),description=document.createElement('b'),location=document.createElement('small'),score=document.createElement('small');description.textContent=s.description;location.textContent=`${s.location}${s.event_date?' · '+s.event_date:''}`;const labels={PENDING:'Awaiting review',REVIEWED:'Contacted',REJECTED:'Dismissed',RESOLVED:'Item recovered'};score.textContent=`Similarity ${Math.round(s.similarity_score*100)}% · ${labels[s.status]||s.status}`;info.append(description,location,score);const contact=document.createElement('a'),raw=s.contact_method.trim();contact.className='smallbtn contactlink';contact.textContent='Contact finder';if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)){contact.href='mailto:'+raw}else if(/^\+?[\d\s().-]{7,}$/.test(raw)){contact.href='tel:'+raw.replace(/[^\d+]/g,'')}else{contact.href='#';contact.onclick=async e=>{e.preventDefault();try{await navigator.clipboard.writeText(raw);alert('Finder contact copied.')}catch{alert('Finder contact: '+raw)}}}contact.style.textDecoration='none';info.append(contact);if(s.status==='PENDING'||s.status==='REVIEWED'){const actions=document.createElement('div');actions.className='sighting-actions';const reviewed=document.createElement('button'),dismiss=document.createElement('button'),recovered=document.createElement('button');if(s.status==='PENDING'){reviewed.className='smallbtn';reviewed.textContent='Mark contacted';reviewed.onclick=()=>updateSighting(s.id,'REVIEWED',id);actions.append(reviewed)}dismiss.className='smallbtn';dismiss.textContent='Dismiss sighting';dismiss.onclick=()=>updateSighting(s.id,'REJECTED',id);recovered.className='smallbtn';recovered.textContent='Mark item recovered';recovered.onclick=()=>updateSighting(s.id,'RESOLVED',id);actions.append(dismiss,recovered);info.append(actions)}e.append(im,info);box.append(e)});box.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function updateSighting(id,status,reportId){if(status==='RESOLVED'&&!window.confirm('Mark this lost item as recovered? This closes its open sighting requests.'))return;try{await api(`/api/sightings/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(status==='RESOLVED'){await load();await showSightings(reportId)}else await showSightings(reportId)}catch(e){alert(e.message)}}
async function deleteReport(id,title){if(!window.confirm(`Permanently remove the report “${title}”, its photo, and associated matches?`))return;try{await api(`/api/reports/${id}`,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
async function updateMatch(id,status,button){try{await api(`/api/matches/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});button.textContent=status==='REVIEWED'?'Reviewed':'Rejected';button.disabled=true}catch(e){alert(e.message)}}
async function updateAuth(){try{const state=await api('/api/auth/me');signedInUser=state.user;if(state.authenticated){const link=$('#account-link');link.textContent=state.user.name+' · Sign out';link.href='#';link.onclick=async e=>{e.preventDefault();try{await api('/api/auth/logout',{method:'POST'});location.reload()}catch(err){alert('Could not sign out: '+err.message)}}}if(state.user?.role==='ADMIN')$('#found-filter').hidden=false}catch{}}const focus=new URLSearchParams(location.search).get('report');updateAuth().then(()=>load()).then(()=>{if(focus)showMatches(focus)});
</script></body></html>
