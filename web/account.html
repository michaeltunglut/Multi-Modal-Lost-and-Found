<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account · Campus Lost &amp; Found</title><style>
:root{--ink:#19362e;--green:#176b53;--paper:#f6f4ee;--line:#dbe2db;--muted:#63716d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;padding:24px}.top{border-bottom:1px solid var(--line);padding:4px 0 16px;font-weight:650}.top a{color:inherit;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}.card{background:#fffefa;border:1px solid var(--line);padding:22px}.card h1{font:27px Georgia;font-weight:400;margin:0}.card p{font-size:13px;color:var(--muted)}label{display:block;font-size:12px;font-weight:650;margin:13px 0 5px}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px}.button{margin-top:16px;padding:11px 15px;background:var(--green);color:white;border:0;border-radius:4px;font-weight:650}.message{display:none;margin-top:15px;padding:10px;background:#f5e8da;color:#704818;font-size:13px}.foot{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><a href="/">↗ Campus Lost &amp; Found</a></header><section class="grid"><form class="card" id="login"><h1>Sign in</h1><p>Sign in to post lost items or view their private found matches.</p><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="button">Sign in</button><div class="message"></div></form><form class="card" id="register"><h1>Create account</h1><p>Accounts connect a lost report to its private match results.</p><label>Name</label><input name="name" autocomplete="name" minlength="2" required><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Password (10+ characters)</label><input name="password" type="password" autocomplete="new-password" minlength="10" required><label>Admin setup token (admin only)</label><input name="admin_token" type="password" autocomplete="off"><button class="button">Create account</button><div class="message"></div></form></section><p class="foot">Lost reports are public. Found reports and their photos are shown only to the owner of a matched lost report and admins.</p></div>
<script>const next=new URLSearchParams(location.search).get('next');const destination=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/reports';async function submit(form,path){const box=form.querySelector('.message');box.style.display='none';try{const r=await fetch(path,{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.detail||'Could not sign in.');location.href=destination}catch(e){box.textContent=e.message;box.style.display='block'}}document.querySelector('#login').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,'/api/auth/login')};document.querySelector('#register').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,'/api/auth/register')};</script></body></html>
